[Assets]

## Export the supported resources to the ExportDirectory.
# Setting type: Boolean
# Default value: false
ExportEnabled = false

## Directory into which the supported resources will be exported.
# Setting type: String
# Default value: %StreamingAssets%
# Acceptable values: absolute or relative path to the EXISTING directory. Placeholders: %StreamingAssets%, %DataPath%, %PersistentDataPath%, %TemporaryCachePath%
ExportDirectory = %StreamingAssets%

## Export text resources: .txt, .csv, .json, etc.
# Setting type: Boolean
# Default value: true
ExportText = true

## Export texture resources: .png, .jpg, .tga.
# Setting type: Boolean
# Default value: true
ExportTextures = true

## Export binary resources: .bytes, etc.
# Setting type: Boolean
# Default value: false
ExportBinary = false

## Overwrites files that exist in the export directory. All your changes will be lost.
# Setting type: Boolean
# Default value: false
ExportOverwrite = false

## Automatically disable export after successful completion.
# Setting type: Boolean
# Default value: true
ExportAutoDisable = true

## Allows logging unsupported resources during export.
# Setting type: Boolean
# Default value: false
ExportLogNotSupportedAssets = false

## Allows logging already exported resources during export.
# Setting type: Boolean
# Default value: false
ExportLogAlreadyExportedAssets = false

## Import the supported resources from the ImportDirectory.
# Setting type: Boolean
# Default value: true
ImportEnabled = true

## Directory from which the supported resources will be imported.
# Setting type: String
# Default value: %StreamingAssets%
# Acceptable values: absolute or relative path to the EXISTING directory. Placeholders: %StreamingAssets%, %DataPath%, %PersistentDataPath%, %TemporaryCachePath%
ImportDirectory = %StreamingAssets%

## Import text resources: .txt, .csv, .json, etc.
# Setting type: Boolean
# Default value: true
ImportText = true

## Import texture resources: .png, .jpg, .tga.
# Setting type: Boolean
# Default value: true
ImportTextures = false

## Import binary resources: .bytes, etc
# Setting type: Boolean
# Default value: false
ImportBinary = false

## Overwrite the supported resources from the ModsDirectory.
# Setting type: Boolean
# Default value: true
ModsEnabled = true

## Directory from which the supported resources will be updated.
# Setting type: String
# Default value: %StreamingAssets%/Mods
# Acceptable values: absolute or relative path to the EXISTING directory. Placeholders: %StreamingAssets%, %DataPath%, %PersistentDataPath%, %TemporaryCachePath%
ModsDirectory = %StreamingAssets%/Mods

